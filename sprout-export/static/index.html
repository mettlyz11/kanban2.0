<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SproutOS Export</title><style>body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui;padding:24px}.card{max-width:760px;margin:40px auto;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:24px}button{background:#22c55e;border:0;border-radius:10px;padding:10px 16px;font-weight:800}textarea{width:100%;min-height:80px;background:#020617;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:12px}</style></head><body><div class="card"><h1>🌱 SproutOS Export</h1><p>这是你的可携带花园。输入目标，调用本地生长引擎。</p><textarea id="goal">我要一个科研管理系统</textarea><br><br><button onclick="grow()">开始生长</button><pre id="out"></pre></div><script>async function grow(){out.textContent='Growing...';try{let r=await fetch('http://127.0.0.1:18795/api/sprout/scenarios');out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent='Engine reachable only inside container API; use /api proxy in production. '+e}}</script></body></html>
