
apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: health
      defaultBucket: health_metrics
      tlsSkipVerify: true
    secureJsonData:
      token: my-token
    isDefault: true
    editable: true
