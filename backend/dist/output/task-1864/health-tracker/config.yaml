# Health Tracker Configuration
# 复制为 config.local.yaml 并填入实际值

influxdb:
  url: "http://localhost:8086"
  token: "your-influxdb-token"
  org: "personal"
  bucket: "health_data"

health:
  # 健康评分权重
  weights:
    activity: 0.30    # 运动 30%
    sleep: 0.30       # 睡眠 30%
    heart_rate: 0.20  # 心率 20%
    energy: 0.20      # 精力 20%
  
  # 目标值
  targets:
    steps: 10000
    active_calories: 500
    sleep_hours: 7.5
    resting_heart_rate: 65
  
  # 异常预警阈值
  alerts:
    resting_hr_high: 80      # 静息心率持续 >80
    resting_hr_low: 50       # 静息心率持续 <50
    sleep_hours_low: 5.0     # 睡眠 <5小时
    sleep_quality_drop: 0.2  # 睡眠质量下降 20%

wechat:
  enabled: false
  webhook_url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_KEY"

apple_health:
  # 使用 Apple Health Export XML 文件路径
  # 或设置 use_mock: true 使用模拟数据
  use_mock: true
  export_path: "~/Downloads/apple_health_export/export.xml"

schedule:
  daily_sync: "07:00"
  weekly_report: "monday 08:00"
  monthly_report: "1 09:00"
