<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司信息管理 - 看板2.4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; }
        .company-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            border-radius: 0 0 20px 20px;
        }
        .info-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .info-label { color: #6c757d; font-size: 0.875rem; margin-bottom: 0.25rem; }
        .info-value { font-size: 1.1rem; font-weight: 500; }
        .document-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-tasks"></i> 看板2.4
            </a>
            <span class="navbar-text text-white">公司信息管理</span>
            <a href="/email" class="btn btn-outline-light btn-sm me-2">
                <i class="fas fa-envelope"></i> 邮件
            </a>
            <a href="/" class="btn btn-outline-light btn-sm">
                <i class="fas fa-arrow-left"></i> 返回看板
            </a>
        </div>
    </nav>

    <!-- 公司头部信息 -->
    <div class="company-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-2 text-center">
                    <i class="fas fa-building fa-4x mb-3"></i>
                </div>
                <div class="col-md-10">
                    <h2>和光智成（北京）科技有限公司</h2>
                    <p class="mb-1"><i class="fas fa-industry"></i> 人工智能 / 化学计算</p>
                    <p class="mb-0"><i class="fas fa-map-marker-alt"></i> 北京市</p>
                </div>
            </div>
        </div>
    </div>

    <div class="container my-4">
        <div class="row">
            <!-- 左侧：基本信息 -->
            <div class="col-md-6">
                <div class="info-card">
                    <h5 class="mb-3"><i class="fas fa-info-circle text-primary"></i> 基本信息</h5>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <div class="info-label">法定代表人</div>
                            <div class="info-value">刘宇宙</div>
                        </div>
                        <div class="col-6 mb-3">
                            <div class="info-label">公司类型</div>
                            <div class="info-value">有限责任公司</div>
                        </div>
                        <div class="col-6 mb-3">
                            <div class="info-label">注册资本</div>
                            <div class="info-value">-</div>
                        </div>
                        <div class="col-6 mb-3">
                            <div class="info-label">成立日期</div>
                            <div class="info-value">-</div>
                        </div>
                        <div class="col-12 mb-3">
                            <div class="info-label">统一社会信用代码</div>
                            <div class="info-value">-</div>
                        </div>
                        <div class="col-12">
                            <div class="info-label">注册地址</div>
                            <div class="info-value">北京市</div>
                        </div>
                    </div>
                </div>

                <div class="info-card">
                    <h5 class="mb-3"><i class="fas fa-address-card text-success"></i> 联系方式</h5>
                    <div class="row">
                        <div class="col-12 mb-2">
                            <div class="info-label">公司邮箱</div>
                            <div class="info-value">-</div>
                        </div>
                        <div class="col-12 mb-2">
                            <div class="info-label">公司电话</div>
                            <div class="info-value">-</div>
                        </div>
                        <div class="col-12">
                            <div class="info-label">公司网站</div>
                            <div class="info-value">-</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：文档和项目 -->
            <div class="col-md-6">
                <div class="info-card">
                    <h5 class="mb-3"><i class="fas fa-folder-open text-warning"></i> 文档资料</h5>
                    <div class="document-item">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <i class="fas fa-file-contract text-primary"></i>
                                <strong>增资协议补充协议</strong>
                                <div class="small text-muted">2026-03-02</div>
                            </div>
                            <button class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-eye"></i> 查看
                            </button>
                        </div>
                    </div>
                    <div class="document-item">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <i class="fas fa-certificate text-success"></i>
                                <strong>营业执照</strong>
                                <div class="small text-muted">待上传</div>
                            </div>
                            <button class="btn btn-sm btn-outline-secondary" disabled>
                                <i class="fas fa-eye"></i> 查看
                            </button>
                        </div>
                    </div>
                    <div class="text-center mt-3">
                        <button class="btn btn-primary" onclick="alert('上传功能开发中')">
                            <i class="fas fa-upload"></i> 上传文档
                        </button>
                    </div>
                </div>

                <div class="info-card">
                    <h5 class="mb-3"><i class="fas fa-project-diagram text-info"></i> 关联项目</h5>
                    <div class="list-group">
                        <a href="/projects/T109" class="list-group-item list-group-item-action">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h6 class="mb-1">T109 过渡态计算平台</h6>
                                    <small class="text-muted">AI驱动的计算化学平台</small>
                                </div>
                                <span class="badge bg-primary">进行中</span>
                            </div>
                        </a>
                        <a href="/projects/Pepi" class="list-group-item list-group-item-action">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h6 class="mb-1">Pepi 数字员工</h6>
                                    <small class="text-muted">AI数字人系统</small>
                                </div>
                                <span class="badge bg-primary">进行中</span>
                            </div>
                        </a>
                    </div>
                </div>

                <div class="info-card">
                    <h5 class="mb-3"><i class="fas fa-users text-secondary"></i> 股东信息</h5>
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>股东名称</th>
                                <th>持股比例</th>
                                <th>认缴出资</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>刘宇宙</td>
                                <td>-</td>
                                <td>-</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
