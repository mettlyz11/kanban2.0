paths:
  logs: "./logs"
  output: "../Files/output"
  data: "./data"
  templates: "./templates"
  reports: "./reports"
  backups: "./backups"

scheduling:
  analysis_interval: 3600
  generation_interval: 3600
  scheduler_interval: 1800
  dashboard_interval: 1800
  monitor_check_interval: 1800
  max_retry_attempts: 5
  retry_delay: 2

models:
  primary: "alicodingplan/kimi-k2.5"
  fallbacks:
    - "huoshanCoding/ark-code-latest"
    - "dmxapi/kimi-k2.5-free"
    - "moonshot/kimi-k2.6"
  timeout: 30
  max_tokens: 4000
  temperature: 0.7

thresholds:
  min_summary_length: 300
  min_log_length: 500
  max_summary_length: 5000
  min_confidence_score: 0.6
  max_processing_time: 600

database:
  host: "rm-2zew4su9p966e8x2ofo.mysql.rds.aliyuncs.com"
  port: 3306
  user: "kanban"
  password: "${DB_PASSWORD}"
  database: "kanban"
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 3600
