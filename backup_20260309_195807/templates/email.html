<!-- 看板邮件系统页面 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮件系统 - 看板2.4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; }
        .email-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .email-sidebar { background: white; border-radius: 8px; min-height: calc(100vh - 100px); }
        .email-main { background: white; border-radius: 8px; min-height: calc(100vh - 100px); }
        .email-item { cursor: pointer; transition: background 0.2s; }
        .email-item:hover { background: #f8f9fa; }
        .email-item.unread { background: #e3f2fd; }
        .contact-item { cursor: pointer; }
        .contact-item:hover { background: #f8f9fa; }
        .nav-btn { 
            display: block; 
            padding: 12px 20px; 
            color: #333; 
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 4px;
        }
        .nav-btn:hover, .nav-btn.active { 
            background: #e3f2fd; 
            color: #1976d2;
            text-decoration: none;
        }
        .nav-btn i { width: 24px; margin-right: 8px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <a class="navbar-brand" href="/">
            <i class="fas fa-tasks"></i> 看板2.4
        </a>
        <span class="navbar-text text-white">
            <i class="fas fa-envelope"></i> 邮件系统
        </span>
        <div>
            <a href="/email" class="btn btn-outline-light btn-sm me-2">
                <i class="fas fa-envelope"></i> 邮件
            </a>
            <a href="/" class="btn btn-outline-light btn-sm">
                <i class="fas fa-arrow-left"></i> 返回看板
            </a>
        </div>
    </nav>

    <div class="email-container">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-3">
                <div class="email-sidebar p-3">
                    <a href="#" class="nav-btn active" onclick="showTab('inbox'); return false;">
                        <i class="fas fa-inbox"></i> 收件箱
                    </a>
                    <a href="#" class="nav-btn" onclick="showTab('compose'); kanbanEmail.compose(); return false;">
                        <i class="fas fa-edit"></i> 写邮件
                    </a>
                    <a href="#" class="nav-btn" onclick="showTab('contacts'); return false;">
                        <i class="fas fa-address-book"></i> 通讯录
                    </a>
                    <a href="#" class="nav-btn" onclick="kanbanEmail.syncEmail(); return false;">
                        <i class="fas fa-sync"></i> 同步邮件
                    </a>
                    
                    <hr>
                    
                    <div id="email-status" class="mt-3">
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i> 正在加载...
                        </div>
                    </div>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="col-md-9">
                <div class="email-main p-3" id="email-panel">
                    <!-- 收件箱 -->
                    <div id="inbox-tab">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5><i class="fas fa-inbox"></i> 收件箱</h5>
                            <div>
                                <input type="text" id="email-search" class="form-control form-control-sm" 
                                    placeholder="搜索邮件..." style="width: 200px; display: inline-block;">
                            </div>
                        </div>
                        <div id="email-inbox-list">
                            <div class="text-center p-5 text-muted">
                                <i class="fas fa-spinner fa-spin fa-2x"></i>
                                <p class="mt-3">加载中...</p>
                            </div>
                        </div>
                    </div>

                    <!-- 通讯录 -->
                    <div id="contacts-tab" style="display: none;">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5><i class="fas fa-address-book"></i> 通讯录</h5>
                            <div>
                                <input type="text" id="contact-search" class="form-control form-control-sm" 
                                    placeholder="搜索联系人..." style="width: 200px; display: inline-block;">
                                <button class="btn btn-primary btn-sm" onclick="kanbanEmail.addContact()">
                                    <i class="fas fa-plus"></i> 添加联系人
                                </button>
                            </div>
                        </div>
                        <div id="email-contacts-list">
                            <div class="text-center p-5 text-muted">
                                <i class="fas fa-spinner fa-spin fa-2x"></i>
                                <p class="mt-3">加载中...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/kanban_email.js"></script>
    <script>
        function showTab(tab) {
            // 隐藏所有标签
            document.getElementById('inbox-tab').style.display = 'none';
            document.getElementById('contacts-tab').style.display = 'none';
            
            // 移除所有active
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            // 显示选中的标签
            if (tab === 'inbox') {
                document.getElementById('inbox-tab').style.display = 'block';
                document.querySelectorAll('.nav-btn')[0].classList.add('active');
            } else if (tab === 'contacts') {
                document.getElementById('contacts-tab').style.display = 'block';
                document.querySelectorAll('.nav-btn')[2].classList.add('active');
            }
        }
    </script>
</body>
</html>
