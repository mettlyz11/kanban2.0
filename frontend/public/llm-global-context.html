<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM 全局上下文</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #1a1a2e; color: #e0e0e0; margin: 0; padding: 20px; }
.container { max-width: 960px; margin: 0 auto; }
h1 { color: #00d4ff; border-bottom: 2px solid #00d4ff33; padding-bottom: 10px; font-size: 20px; }
.file-section { background: #16213e; border: 1px solid #0f3460; border-radius: 8px; margin: 10px 0; padding: 0; }
.file-header { background: #0f3460; padding: 8px 14px; font-size: 13px; color: #00d4ff; border-radius: 8px 8px 0 0; font-weight: 600; }
.file-body { padding: 14px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; font-family: "SF Mono", "Menlo", monospace; color: #c0c0c0; }
.meta { color: #888; font-size: 12px; margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; }
.tag { display: inline-block; background: #00d4ff22; color: #00d4ff; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
</style>
</head>
<body>
<div class="container">
<h1>🤖 LLM 全局上下文（发送给进化体系 LLM 的系统背景信息）</h1>
<div id="content">加载中...</div>
<div class="meta">
  <span class="tag">自动生成</span>
  <span id="ts"></span>
  <span class="tag" style="margin-left:8px">~12K chars</span>
  <span class="tag" style="margin-left:8px">6 files</span>
</div>
</div>
<script>
fetch('/llm_global_context.txt').then(r=>r.text()).then(t => {
  const parts = t.split(/\n(?=\/\*\*)/);
  let html = '';
  parts.forEach(p => {
    const m = p.match(/\/\*\*\s*(.+?)\s*\*\*\/\n?(.*)$/s);
    if (m) {
      const [_, head, body] = m;
      html += `<div class="file-section"><div class="file-header">📄 ${head}</div><div class="file-body">${body}</div></div>`;
    }
  });
  document.getElementById('content').innerHTML = html;
  document.getElementById('ts').textContent = '| 更新: ' + new Date().toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'});
}).catch(e => { document.getElementById('content').innerHTML = '<p style="color:red">加载失败: '+e+'</p>'; });
</script>
</body>
</html>
